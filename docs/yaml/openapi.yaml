              - payroll_date
            properties:
                id:
                    type: string
                user_id:
                    type: string
                amount:
                    type: number
                payroll_date:
                    $ref: '#/components/schemas/Timestamp'

        PaymentsResponse:
            type: object
            additionalProperties: false
            required:
              - payments
            properties:
                payments:
                    type: array
                    items:
                        $ref: "#/components/schemas/Payment"

        SearchBasicRequest:
