openapi: 3.0.0
info:
    description: Working Day Service
    title: Working Day Service
    version: '1.0'

servers:
  - url: http://84.201.137.230:8080
    description: production

paths:
    /v1/employees:
        get:
            description: Get list of employees
            parameters:
              - in: header
                name: Authorization
                description: Token of session user
                schema:
                    type: string
            responses:
                '200':
                    description: Employee information
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/EmployeesResponse'

    /v1/employee/add:
        post:
            description: Add new employee
            parameters:
              - in: header
                name: Authorization
                description: Token of session user
                schema:
                    type: string
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/EmployeeAddRequest'
            responses:
                '200':
                    description: Login information
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/LoginInfo'

    /v1/employee/add-head:
        post:
            description: Add head of the employee
            parameters:
              - in: query
                name: employee_id
                description: Id of the employee to add head to
                schema:
                    type: string
              - in: header
                name: Authorization
                description: Token of session user
                schema:
                    type: string
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/EmployeeAddHeadRequest'
            responses:
                '200':
                    description: Head was added


    /v1/employee/remove:
        post:
            description: Remove new employee
            parameters:
              - in: query
                name: employee_id
                description: Id of the employee to remove
                schema:
                    type: string
              - in: header
                name: Authorization
                description: Token of session user
                schema:
                    type: string
            responses:
                '200':
                    description: Employee was removed

    /v1/employee/info:
        get:
            description: Get employee info
            parameters:
              - in: query
                name: employee_id
                description: Id of the employee to check
                schema:
                    type: string
              - in: header
                name: Authorization
                description: Token of session user
                schema:
                    type: string
            responses:
                '200':
                    description: Employee information
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Employee'
                # Applies for all handlers with authorization header
                '401':
                    description: Unauthorized
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorMessage'
                # Applies for all handlers with authorization header
                '403':
                    description: Wrong authorization token
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorMessage'
                '404':
                    description: Not found
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorMessage'

    /v1/profile/upload-photo:
        post:
            description: Upload personal photo
            parameters:
              - in: header
                name: Authorization
                description: Token of session user
                schema:
                    type: string
            responses:
                '200':
                    description: Upload link
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/UploadPhotoResponse'

    /v1/profile/edit:
        post:
            description: Edit personal information
            parameters:
              - in: header
                name: Authorization
                description: Token of session user
                schema:
                    type: string
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ProfileEditRequest'
            responses:
                '200':
                    description: Information was updated

    /v1/authorize:
        post:
            description: Authorize user
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/AuthorizeRequest'
            responses:
                '200':
                    description: Authorized successfully
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AuthorizeResponse'
                '404':
                    description: Not found
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorMessage'

    /v1/notifications:
        post:
            description: Get list of notifications
            parameters:
              - in: header
                name: Authorization
                description: Token of session user
                schema:
                    type: string
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/NotificationsRequest'
            responses:
                '200':
                    description: List of notifications
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/NotificationsResponse'

    /v1/actions:
        post:
            description: Get list of user actions for a certain period
            parameters:
              - in: header
                name: Authorization
                description: Token of session user
                schema:
                    type: string
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ActionsRequest'
            responses:
                '200':
                    description: List of user actions
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ActionsResponse'

    /v1/abscence/request:
        post:
            description: Request an abscence
            parameters:
              - in: header
                name: Authorization
                description: Token of session user
                schema:
                    type: string
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/AbscenceRequestRequest'
            responses:
                '200':
                    description: Abscence was requested
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AbscenceRequestResponse'

    /v1/abscence/verdict:
        post:
            description: Approve or deny an abscence
            parameters:
              - in: header
                name: Authorization
                description: Token of session user
                schema:
                    type: string
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/AbscenceVerdictRequest'
            responses:
                '200':
                    description: Verdict was sent
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AbscenceVerdictResponse'
                '404':
                    description: Not found
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorMessage'

    /v1/abscence/split:
        post:
            description: Split an abscence
            parameters:
              - in: header
                name: Authorization
                description: Token of session user
                schema:
                    type: string
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/AbscenceSplitRequest'
            responses:
                '200':
                    description: Abscence was split
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AbscenceSplitResponse'
                '400':
                    description: Wrong split date
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorMessage'

    /v1/abscence/reschedule:
        post:
            description: Reschedule an abscence
            parameters:
              - in: header
                name: Authorization
                description: Token of session user
                schema:
                    type: string
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/AbscenceRescheduleRequest'
            responses:
                '200':
                    description: Abscence was rescheduled
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AbscenceRescheduleResponse'

    /v1/documents/vacation:
        get:
            description: Generate vacation document
            parameters:
              - in: header
                name: Authorization
                description: Token of session user
                schema:
                    type: string
              - in: query
                name: action_id
                description: Id of vacation action
                schema:
                    type: string
              - in: query
                name: request_type
                description: Vacation request type
                schema:
                    type: string
                    enum:
                      - create
                      - split
            responses:
                '200':
                    description: Generated document download link
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/DocumentsVacationResponse'
                '400':
                    description: Action type is not vacation
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorMessage'


    /v1/documents/generate_from_template:
        post:
            description: Generate document from template with parameters
            parameters:
              - in: header
                name: Authorization
                description: Token of session user
                schema:
                    type: string
              - in: query
                name: action_id
                description: Id of the action
                schema:
                    type: string
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/GenerateFromTemplateRequest'

            responses:
                '200':
                    description: Generated document download link
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GenerateFromTemplateResponse'
                '400':
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorMessage'


    /v1/attendance/add:
        post:
            description: Add attendance hours for a certain employee
            parameters:
              - in: header
                name: Authorization
                description: Token of session user
                schema:
                    type: string
              - in: query
                name: employee_id
                description: Id of employee to add attendance for
                schema:
                    type: string
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/AttendanceAddRequest'
            responses:
                '200':
                    description: Attendance was added successfully

    /v1/payments/add-bulk:
        post:
            description: Add bulk payment updates
            parameters:
              - in: header
                name: Authorization
                description: Token of session user
                schema:
                    type: string
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/PaymentsAddBulkRequest'
            responses:
                '200':
                    description: New payments were added successfully

    /v1/payments:
        get:
            description: Get employee's payments
            parameters:
              - in: header
                name: Authorization
                description: Token of session user
                schema:
                    type: string
            responses:
                '200':
                    description: Payments for employee
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PaymentsResponse'

    /v1/clear-tasks:
        get:
            description: Clear the tasks queue
            responses:
                '200':
                    description: Tasks were cleared

    /v1/search/basic:
        post:
            description: Get employees by key
            parameters:
              - in: header
                name: Authorization
                description: Token of session user
                schema:
                    type: string
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/SearchBasicRequest'
            responses:
                '200':
                    description: List of employees
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SearchResponse'

    /v1/search/full:
        post:
            description: Get employees by multiple keys
            parameters:
              - in: header
                name: Authorization
                description: Token of session user
                schema:
                    type: string
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/SearchFullRequest'
            responses:
                '200':
                    description: List of employees
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SearchResponse'

    /v1/search/suggest:
        post:
            description: Get employees suggestion by key
            parameters:
              - in: header
                name: Authorization
                description: Token of session user
                schema:
                    type: string
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/SearchSuggestRequest'
            responses:
                '200':
                    description: List of employees
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SearchResponse'

    /v1/attendance/list-all:
        post:
            description: Get list of all employees' attendances for a given time period
            parameters:
              - in: header
                name: Authorization
                description: Token of session user
                schema:
                    type: string
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/AttendanceListAllRequest'
            responses:
                '200':
                    description: List of attendances
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AttendanceListAllResponse'

    /v1/attendance/export_to_excel:
        post:
            description: Export list of all employees' attendances for a given time period to excel format
            parameters:
              - in: header
                name: Authorization
                description: Token of session user
                schema:
                    type: string
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/AttendanceListAllRequest'
            responses:
                '200':
                    description: Generated excel document download link
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ExcelAttendancesResponse'

    /v1/documents/upload:
        post:
            description: Upload document
            parameters:
              - in: header
                name: Authorization
                description: Token of session user, available for managers only
                schema:
                    type: string
            requestBody:
                required: false
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/DocumentsUploadRequest'
            responses:
                '200':
                    description: Upload link
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/UploadDocumentResponse'

    /v1/documents/send:
        post:
            description: Send document
            parameters:
              - in: header
                name: Authorization
                description: Token of session user, available for managers only
                schema:
                    type: string
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/DocumentSendRequest'
            responses:
                '200':
                    description: Document was sent
                '500':
                    description: Document sending failed, need to retry

    /v1/documents/list:
        get:
            description: Get list of documents
            parameters:
              - in: header
                name: Authorization
                description: Token of session user
                schema:
                    type: string
            responses:
                '200':
                    description: List of documents
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/DocumentsListResponse'

    /v1/documents/download:
        get:
            description: Download document
            parameters:
              - in: header
                name: Authorization
                description: Token of session user
                schema:
                    type: string
              - in: query
                name: id
                description: Id of the document
                schema:
                    type: string
            responses:
                '200':
                    description: Download link
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/DownloadDocumentResponse'

    /v1/documents/list-all:
        get:
            description: Get list of all existing documents
            parameters:
              - in: header
                name: Authorization
                description: Token of session user, available for managers only
                schema:
                    type: string
            responses:
                '200':
                    description: List of documents
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/DocumentsListAllResponse'

    /v1/documents/get-signs:
        get:
            description: Get list of employees who signed the document
            parameters:
              - in: header
                name: Authorization
                description: Token of session user, available for managers only
                schema:
                    type: string
              - in: query
                name: document_id
                description: Id of the document
                schema:
                    type: string
            responses:
                '200':
                    description: List of employees
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/DocumentsGetSignsResponse'

    /v1/documents/sign:
        post:
            description: Sign the document
            parameters:
              - in: header
                name: Authorization
                description: Token of session user
                schema:
                    type: string
              - in: query
                name: document_id
                description: Id of the document
                schema:
                    type: string
            responses:
                '200':
                    description: Document was signed
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AbscenceVerdictResponse'


    /v1/superuser/company/add:
        post:
            description: Add new company
            parameters:
              - in: header
                name: Authorization
                description: Token of session user, available for superuser only
                schema:
                    type: string
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/SuperuserCompanyAddRequest'
            responses:
                '200':
                    description: Company was added

    /v1/inventory/add:
        post:
            description: Add new inventory item
            parameters:
              - in: header
                name: Authorization
                description: Token of session user, available for superuser only
                schema:
                    type: string
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/InventoryAddRequest'
            responses:
                '200':
                    description: Inventory item was added

    /v1/tracker/projects/add:
        post:
            description: Add new project
            parameters:
              - in: header
                name: Authorization
                description: Token of session user
                schema:
                    type: string
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/TrackerProjectsItemRequest'
            responses:
                '200':
                    description: Project item was added
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TrackerProjectsAddResponse'
                '400':
                    description: Bad request, missing parameters or invalid assigned_users_ids
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorMessage'

    /v1/tracker/project/info:
        get:
            description: Get project info
            parameters:
              - in: query
                name: project_id
                description: ID of the project to check
                schema:
                    type: string
              - in: header
                name: Authorization
                description: Token of session user
                schema:
                    type: string
            responses:
                '200':
                    description: Project information
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TrackerProjectsItemResponse'
                '400':
                    description: Bad request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorMessage'
                '404':
                    description: Not found
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorMessage'

    /v1/tracker/projects/list:
        get:
            description: Get list of all existing projects
            parameters:
              - in: header
                name: Authorization
                description: Token of session user
                schema:
                    type: string
            responses:
                '200':
                    description: List of projects
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TrackerProjectsItemResponseShort'

    # TODO: /v1/tracker/project/available-to-user:
    #        description: Get all projects available to the user

    /v1/tracker/projects/edit:
        post:
            description: Edit project information
            parameters:
                - in: query
                  name: project_id
                  description: ID of the project to edit information for
                  schema:
                      type: string
                - in: header
                  name: Authorization
                  description: Token of session user
                  schema:
                      type: string
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/TrackerProjectsEditRequest'
            responses:
                '200':
                    description: Information was updated
                '400':
                description: Bad request, missing parameters or invalid assigned_users_ids
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ErrorMessage'
                '404':
                    description: Not found
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorMessage'


    /v1/tracker/projects/media/upload:
        post:
            description: Upload icon for the project
            parameters:
              - in: query
                name: project_id
                schema:
                    type: string
              - in: header
                name: Authorization
                description: Token of session user
                schema:
                    type: string

            responses:
                '200':
                    description: Upload link
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/MediaUploadResponse'
                '400':
                    description: Bad request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorMessage'


    /v1/tracker/tasks/add:
        post:
            description: Add new task
            parameters:
              - in: header
                name: Authorization
                description: Token of session user
                schema:
                    type: string
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/TrackerTasksItemRequest'
            responses:
                '200':
                    description: Task item was added
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TrackerTasksAddResponse'

                '404':
                    description: Project not found
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorMessage'

    /v1/tracker/tasks/list:
        get:
            description: Get list of all existing tasks
            parameters:
                - in: header
                  name: Authorization
                  description: Token of session user
                  schema:
                      type: string
            responses:
                '200':
                    description: List of tasks
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TrackerTasksListResponse'

    /v1/tracker/tasks/info:
        get:
            description: Get task info
            parameters:
              - in: query
                name: task_id
                description: Id of the task to check
                schema:
                    type: string
              - in: header
                name: Authorization
                description: Token of session user
                schema:
                    type: string
            responses:
                '200':
                    description: Task information
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TrackerTasksItemResponse'
                '400':
                    description: Bad request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorMessage'
                '404':
                    description: Not found
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorMessage'

    /v1/tracker/tasks/assigned-to-user:
        get:
            description: Get all tasks assigned to the user
            parameters:
              - in: query
                name: employee_id
                description: Id of the employee to get tasks for
                schema:
                    type: string
              - in: header
                name: Authorization
                description: Token of session user
                schema:
                    type: string
            responses:
                '200':
                    description: List of tasks assigned to the user
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TrackerTasksListResponse'
                '400':
                description: Bad request, missing parameters
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ErrorMessage'
                '404':
                    description: Not found
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorMessage'

    /v1/tracker/tasks/edit:
        post:
            description: Edit task information
            parameters:
              - in: query
                name: task_id
                description: Id of the task to edit information for
                schema:
                    type: string
              - in: header
                name: Authorization
                description: Token of session user
                schema:
                    type: string
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/TrackerTasksEditRequest'
            responses:
                '200':
                    description: Information was updated
                '400':
                    description: Bad request, missing parameters
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorMessage'
                '404':
                        description: Not found
                        content:
                            application/json:
                                schema:
                                    $ref: '#/components/schemas/ErrorMessage'

    # вызов /v1/documents/upload, а затем /v1/tracker/tasks/documents/send
    /v1/tracker/tasks/documents/send:
        post:
            description: Attach uploaded document to the task
            parameters:
              - in: query
                name: task_id
                schema:
                    type: string
                description: ID of the task
              - in: header
                name: Authorization
                description: Token of session user
                schema:
                    type: string
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/TrackerTasksDocumentItem'

            responses:
                '200':
                    description: Document was attached to task successfully
                '400':
                    description: Bad request
                    content:
