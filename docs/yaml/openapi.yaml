components:
    schemas:
        ErrorMessage:
            type: object
            additionalProperties: false
            required:
              - message
            properties:
                message:
                    type: string

        Timestamp:
            type: string
            description: Timestamp with the following format "%Y-%m-%dT%H:%M:%E6S" in UTC
            format: date-time

        ListEmployee:
            type: object
            additionalProperties: false
            required:
              - id
              - name
              - surname
            properties:
                id:
                    type: string
                name:
                    type: string
                surname:
                    type: string
                patronymic:
                    type: string
                photo_link:
                    type: string
                subcompany:
                    type: string

        EmployeesResponse:
            type: object
            additionalProperties: false
            required:
              - employees
            properties:
                employees:
                    type: array
                    items:
                        $ref: '#/components/schemas/ListEmployee'

        EmployeeAddRequest:
            type: object
            additionalProperties: false
            required:
              - name
              - surname
              - role
              - job_position
            properties:
                name:
                    type: string
                surname:
                    type: string
                patronymic:
                    type: string
                role:
                    $ref: '#/components/schemas/Role'
                job_position:
                    type: string
                company_id:
                    description: Company id of new employee. This field is available for superuser only
                    type: string

        LoginInfo:
            type: object
            additionalProperties: false
            required:
                - login
                - password
            properties:
                login:
                    type: string
                password:
                    type: string

        EmployeeAddHeadRequest:
            type: object
            additionalProperties: false
            required:
              - head_id
            properties:
                head_id:
                    type: string

        Employee:
            type: object
            additionalProperties: false
            required:
              - id
              - name
              - surname
            properties:
                id:
                    type: string
                name:
                    type: string
                surname:
                    type: string
                patronymic:
                    type: string
                phones:
                    type: array
                    items:
                        type: string
                email:
                    type: string
                birthday:
                    type: string
                photo_link:
                    type: string
                password:
                    type: string
                head_id:
                    type: string
                telegram_id:
                    type: string
                vk_id:
                    type: string
                team:
                    type: string
                inventory:
                    type: array
                    items:
                        $ref: '#/components/schemas/InventoryItem'
                job_position:
                    type: string

        ProfileEditRequest:
            type: object
            additionalProperties: false
            properties:
                phones:
                    type: array
                    items:
                        type: string
                email:
                    type: string
                birthday:
                    type: string
                password:
                    type: string
                telegram_id:
                    type: string
                vk_id:
                    type: string
                team:
                    type: string
                job_position:

        AuthorizeRequest:
            type: object
            additionalProperties: false
            required:
              - login
              - password
              - company_id
            properties:
                login:
                    type: string
                password:
                    type: string
                company_id:
                    type: string

        AuthorizeResponse:
            type: object
            additionalProperties: false
            required:
              - token
              - role
            properties:
                token:
                    type: string
                role:
                    $ref: '#/components/schemas/Role'

        NotificationsRequest:
            type: object
            additionalProperties: false
            properties:
                #Not supported yet
                earlier_than:
                    $ref: '#/components/schemas/Timestamp'
        NotificationsResponse:
            type: object
            additionalProperties: false
            required:
              - notifications
            properties:
                notifications:
                    type: array
                    items:
                        $ref: '#/components/schemas/Notification'

        Notification:
            type: object
            additionalProperties: false
            required:
              - id
              - type
              - is_read
              - text
              - created
              - action_id
            properties:
                id:
                    type: string
                type:
                    type: string
                    enum:
                      - vacation_request  # Vacation request from your employee
                      - vacation_approved # Head approved your vacation request
                      - vacation_denied   # Head denied your vacation request
                      - attendance_added  # Manager added your attendance
                      - generic           # Notification that doesn't require any action
                is_read:
                    type: boolean
                sender:
                    $ref: "#/components/schemas/ListEmployee"
                text:
                    type: string
                action_id:
                    type: string
                created:
                    type: string

        ActionsRequest:
            type: object
            additionalProperties: false
            required:
              - from
              - to
            properties:
                from:
                    $ref: '#/components/schemas/Timestamp'
                to:
                    $ref: '#/components/schemas/Timestamp'
                employee_id:
                    type: string
                    description: If head wants to watch employee's actions

        ActionsResponse:
            type: object
            additionalProperties: false
            required:
              - actions
            properties:
                actions:
                    type: array
                    items:
                        $ref: '#/components/schemas/UserAction'

        UserAction:
            type: object
            additionalProperties: false
            required:
              - id
              - type
              - start_date
              - end_date
              - blocking_actions_ids
            properties:
                id:
                    type: string
                type:
                    type: string
                    enum:
                      - vacation
                      - attendance
                start_date:
                    $ref: '#/components/schemas/Timestamp'
                end_date:
                    $ref: '#/components/schemas/Timestamp'
                status:
                    type: string
                blocking_actions_ids:
                    type: array
                    items:
                        type: string
                attendance_type:
                    $ref: '#/components/schemas/AttendanceType'

        AbscenceRequestRequest:
            type: object
            additionalProperties: false
            required:
              - start_date
              - end_date
              - type
            properties:
                start_date:
                    $ref: '#/components/schemas/Timestamp'
                end_date:
                    $ref: '#/components/schemas/Timestamp'
                type:
                    $ref: '#/components/schemas/AbscenceType'

        AbscenceType:
            type: string
            enum:
                - vacation                              # 5 - ежегодный отпуск
                - sick_leave                            # больничный
                - unpaid_vacation                       # 18 - отпуск без сохранения ЗП
                - business_trip                         # командировка
                - overtime                              # 19 - сверхурочная работа / работа в выходной
                - vacation_days_instead                 # 1 - дни в счёт ежегодного отпуска
                - payout_birth                          # 2 - единовременная выплата при рождении ребёнка
                - certificates_on_dismissal             # 3 - выдача справок при увольнении
                - tax_deduction_children                # 6 - налоговый вычет на детей
                - part_time                             # 7 - заявление на неполный рабочий день
                - maternity_childcare_15                # 8 - отпуск по уходу за ребёнком до 1.5 лет
                - maternity_childcare_3                 # 9 - отпуск по уходу за ребёнком до 3 лет
                - maternity_pregnancy                   # 10 - отпуск по беременности и родам
                - transfer                              # 11 - перевод на другую должность
                - vacation_shift                        # 12 - перенос ежегодного отпуска
                - maternity_work_during                 # 13 - работа в период декретного отпуска
                - personal_data_change                  # 14 - смена персональных данных
                - resignation                           # 15 - увольнение по собственному желанию
                - maternity_early_exit                  # 16 - досрочный выход из отпуска по уходу
                - unpaid_vacation_with_reason           # 17 - отпуск без сохранения ЗП


        AbscenceRequestResponse:
            type: object
            additionalProperties: false
            required:
              - action_id
            properties:
                action_id:
                    type: string

        AbscenceVerdictRequest:
            type: object
            additionalProperties: false
            required:
              - action_id
              - approve
            properties:
                action_id:
                    type: string
                notification_id:
                    type: string
                approve:
                    type: boolean

        AbscenceVerdictResponse:
            type: object
            additionalProperties: false
            required:
              - signed_file_key
            properties:
                signed_file_key:
                    type: string

        DocumentsVacationResponse:
            type: object
            additionalProperties: false
            required:
              - download_link
            properties:
                download_link:
                    type: string

        ExcelAttendancesResponse:
            type: object
            additionalProperties: false
            required:
              - download_link
            properties:
                download_link:
                    type: string

        UploadPhotoResponse:
            type: object
            additionalProperties: false
            required:
              - url
            properties:
                url:
                    type: string

        Role:
            type: string
            enum:
              - user
              - admin
              - manager
              - robot

        AttendanceType:
            type: string
            enum:
                - work_daytime # Я
                - work_nighttime # Н
                - work_weekend_holiday # РВ
                - overtime # C
                - business_trip # K
                - vacation # ОТ
                - additional_paid_vacation # ОД
                - study_vacation_paid # У
                - study_vacation_unpaid # УД
                - maternity_leave # Р
                - childcare_leave # ОЖ
                - unpaid_vacation # ДО
                - sick_leave # Б
                - shortened_work_time # ЛЧ
                - absence_without_reason # ПР
                - part_time_by_employer # НС
                - weekend_holiday # В
                - absence_unknown_reason # НН
                - downtime_not_employer_fault # НП
                - suspension_with_pay # НО
                - tracker_task_deadline # ТД

        AttendanceAddRequest:
            type: object
            additionalProperties: false
            required:
              - start_date
              - end_date
              - attendance_type
            properties:
                start_date:
                    $ref: '#/components/schemas/Timestamp'
                end_date:
                    $ref: '#/components/schemas/Timestamp'
                attendance_type:
                    $ref: '#/components/schemas/AttendanceType'

        AbscenceSplitRequest:
            type: object
            additionalProperties: false
            required:
              - action_id
              - split_date
            properties:
                action_id:
                    type: string
                split_date:
                    $ref: '#/components/schemas/Timestamp'

        AbscenceSplitResponse:
            type: object
            additionalProperties: false
            required:
              - first_action_id
              - second_action_id
            properties:
                first_action_id:
                    type: string
                second_action_id:
                    type: string

        AbscenceRescheduleRequest:
            type: object
            additionalProperties: false
            required:
              - action_id
              - reschedule_date
            properties:
                action_id:
                    type: string
                reschedule_date:
                    $ref: '#/components/schemas/Timestamp'

        AbscenceRescheduleResponse:
            type: object
            additionalProperties: false
            required:
              - action_id
            properties:
                action_id:
                    type: string

        PaymentsAddBulkRequest:
            type: object
            additionalProperties: false
            required:
              - payments
            properties:
                payments:
                    type: array
                    items:
                        $ref: "#/components/schemas/Payment"

        Payment:
            type: object
            additionalProperties: false
