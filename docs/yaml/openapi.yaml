                        $ref: '#/components/schemas/TrackerProjectsItemResponseShort'

        AttendanceListAllRequest:
            type: object
            additionalProperties: false
            required:
              - from
              - to
            properties:
                from:
                    $ref: '#/components/schemas/Timestamp'
                to:
                    $ref: '#/components/schemas/Timestamp'

        AttendanceListAllResponse:
            type: object
            additionalProperties: false
            required:
              - attendances
            properties:
                attendances:
