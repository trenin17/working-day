# /v1/documents/vacation
GenerateVacationDocument:
    get:
        description: Generate vacation document
        parameters:
          - in: header
            name: Authorization
            description: Token of session user
            schema:
                type: string
          - in: query
            name: action_id
            description: Id of vacation action
            schema:
                type: string
          - in: query
            name: request_type
            description: Vacation request type
            schema:
                type: string
                enum:
                  - create
                  - split
        responses:
            '200':
                description: Generated document download link
                content:
                    application/json:
                        schema:
                            $ref: '../components/document.yaml#/DocumentsVacationResponse'
            '400':
                description: Action type is not vacation
                content:
                    application/json:
                        schema:
                            $ref: '../components/common.yaml#/ErrorMessage'

# /v1/documents/upload
DocumentUpload:
    post:
        description: Upload document
        parameters:
          - in: header
            name: Authorization
            description: Token of session user, available for managers only
            schema:
                type: string
        requestBody:
            required: false
            content:
                application/json:
                    schema:
                        $ref: '../components/document.yaml#/DocumentsUploadRequest'
        responses:
            '200':
                description: Upload link
                content:
                    application/json:
                        schema:
                            $ref: '../components/document.yaml#/UploadDocumentResponse'

# /v1/documents/send
SendDocument:
    post:
        description: Send document
        parameters:
          - in: header
            name: Authorization
            description: Token of session user, available for managers only
            schema:
                type: string
        requestBody:
            required: true
            content:
                application/json:
                    schema:
                        $ref: '../components/document.yaml#/DocumentSendRequest'
        responses:
            '200':
                description: Document was sent
            '500':
                description: Document sending failed, need to retry

# /v1/documents/list
DocumentsList:
