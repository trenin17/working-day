# /v1/documents/sign
SignDocument:
    post:
        description: Sign the document
        parameters:
          - in: header
            name: Authorization
            description: Token of session user
            schema:
                type: string
          - in: query
            name: document_id
            description: Id of the document
            schema:
                type: string
        responses:
            '200':
                description: Document was signed

# /v1/documents/chain/update
DocumentStatusUpdate:
    post:
        description: Update status of the document
        parameters:
          - in: header
            name: Authorization
            description: Token of session user
            schema:
                type: string
          - in: query
            name: document_id
            description: Id of the document
            schema:
                type: string
        requestBody:
            required: true
            content:
                application/json:
                    schema:
                        $ref: '../components/document.yaml#/DocumentsChainUpdateRequest'
        responses:
            '200':
                description: Document was signed
                content:
                    application/json:
                        schema:
                            $ref: '../components/document.yaml#/DocumentsChainUpdateResponse'
            '404':
                description: Not found
                content:
                    application/json:
                        schema:
                            $ref: '../components/common.yaml#/ErrorMessage'
            '400':
                description: Bad request
                content:
                    application/json:
                        schema:
                            $ref: '../components/common.yaml#/ErrorMessage'
            '409':
                description: Conflict
                content:
                    application/json:
                        schema:
                            $ref: '../components/common.yaml#/ErrorMessage'

# /v1/documents/chain/add
AddChainDocument:
    post:
        description: Add signature chain to the document
        parameters:
          - in: header
            name: Authorization
            description: Token of session user
            schema:
                type: string
          - in: query
            name: document_id
            description: Id of the document
            schema:
                type: string
        requestBody:
            required: true
            content:
                application/json:
                    schema:
                        $ref: '../components/document.yaml#/DocumentsChainAddRequest'
        responses:
            '200':
                description: Chain was added
            '404':
                description: Document not found
                content:
                    application/json:
                        schema:
                            $ref: '../components/common.yaml#/ErrorMessage'
            '400':
                description: Bad request
                content:
                    application/json:
                        schema:
                            $ref: '../components/common.yaml#/ErrorMessage'
            '409':
                description: Conflict (chain already exists)
                content:
                    application/json:
                        schema:
                            $ref: '../components/common.yaml#/ErrorMessage'