# yaml

components_manager:
    coro_pool:
        initial_size: 500             # Preallocate 500 coroutines at startup.
        max_size: 1000                # Do not keep more than 1000 preallocated coroutines.

    task_processors:                  # Task processor is an executor for coroutine tasks

        main-task-processor:          # Make a task processor for CPU-bound couroutine tasks.
            worker_threads: $worker-threads         # Process tasks in 4 threads.
            thread_name: main-worker  # OS will show the threads of this task processor with 'main-worker' prefix.

        fs-task-processor:            # Make a separate task processor for filesystem bound tasks.
            thread_name: fs-worker
            worker_threads: $worker-fs-threads

        monitor-task-processor:       # for monitoring
            thread_name: mon-worker
            worker_threads: 1

    default_task_processor: main-task-processor

    components:                       # Configuring components that were registered via component_list
        server:
            listener:                 # configuring the main listening socket...
                port: $server-port            # ...to listen on this port and...
                task_processor: main-task-processor    # ...process incoming requests on this task processor.
            listener-monitor:
                # Listen on 8086 port for developer/utility requests
                port: 8086
                connection:
                    in_buffer_size: 32768
                    requests_queue_size_threshold: 100
                task_processor: monitor-task-processor
        logging:
            fs-task-processor: fs-task-processor
            loggers:
                default:
                    file_path: '/tmp/logs/working_day/log.txt'
                    level: $logger-level
                    overflow_behavior: discard  # Drop logs if the system is too busy to write them down.

        tracer:                              # Component that helps to trace execution times and requests in logs.
            service-name: working_day   # "You know. You all know exactly who I am. Say my name. " (c)

        dynamic-config:                      # Dynamic config storage options, do nothing
            defaults:
                HTTP_CLIENT_CONNECTION_POOL_SIZE: 1000
                POSTGRES_DEFAULT_COMMAND_CONTROL:
                    network_timeout_ms: 750
                    statement_timeout_ms: 500
                USERVER_NO_LOG_SPANS:
                    prefixes:
                        [
                            "pg_query"
                        ]
                    names:
                        [
                            "connection_pool_monitor",
                            "pg_maintain",
                            "file-resolver-reload",
                            "http/handler-server-monitor",
                            "connlimit_watchdog",
                            "http_easy_reinit",
                            "pg_connect",
                            "load_secdist_from_file",
                            "net-resolver-init",
                            "all_components_loaded",
                            "first-update/auth-pg-cache",
                            "load_secdist_from_file",
                            "component_stop",
                            "on_all_components_are_stopping",
                            "update-task/auth-pg-cache",
                            "file-resolver-updater"
                        ]


        logging-configurator:
          load-enabled: true
          limited-logging-enable: true
          limited-logging-interval: 2s

        testsuite-support: {}

        http-client:
            fs-task-processor: fs-task-processor

        tests-control:
            load-enabled: $is_testing
            path: /tests/{action}
            method: POST
            task_processor: main-task-processor
        handler-ping:
            path: /ping
            method: GET
            task_processor: main-task-processor
            throttling_enabled: false
            url_trailing_slash: strict-match

        handler-server-monitor:
            path: /service/monitor
            method: GET
            task_processor: monitor-task-processor

        secdist: {}
        default-secdist-provider:
            config: configs/secdist.json
            missing-ok: true
            environment-secrets-key: SECDIST_CONFIG

        handler-v1-employee-add:
